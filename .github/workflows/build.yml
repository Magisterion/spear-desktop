name: Build Spear portable
on:
  push:
    branches: [master, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  normalize-generated-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/classic-desktop' && startsWith(github.event.head_commit.message, 'Spear preview:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.normalize.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Use a service identity for the generated preview commit
        id: normalize
        shell: bash
        env:
          GIT_AUTHOR_NAME: Spear contributors
          GIT_AUTHOR_EMAIL: noreply@users.noreply.github.com
          GIT_COMMITTER_NAME: Spear contributors
          GIT_COMMITTER_EMAIL: noreply@users.noreply.github.com
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 627122f39efad5e096e7c86c3fd83ad219e9c604
          safe=$(git commit-tree "HEAD^{tree}" -p "HEAD^" -m "Harden Spear startup diagnostics and portable checks")
          git push origin "$safe:refs/heads/feat/classic-desktop" --force-with-lease="refs/heads/feat/classic-desktop:$GITHUB_SHA"
          echo "sha=$safe" >> "$GITHUB_OUTPUT"
  windows:
    needs: normalize-generated-history
    if: always() && (needs.normalize-generated-history.result == 'success' || needs.normalize-generated-history.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.normalize-generated-history.outputs.sha || github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Smoke test local preferences and portable data
        run: pnpm exec playwright test tests/classic-smoke.test.js --workers=1 --timeout=60000
      - run: pnpm exec electron-builder --win portable:x64 -p never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksum
        shell: pwsh
        run: |
          $file = 'pack/YouTube-Music-Spear.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  YouTube-Music-Spear.exe" | Set-Content "$file.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Spear-Windows-x64-portable
          path: |
            pack/YouTube-Music-Spear.exe
            pack/YouTube-Music-Spear.exe.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Preferences preview
        uses: actions/upload-artifact@v4
        with:
          name: Spear-preferences-preview
          path: test-results/spear-preferences.png
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Spear-Windows-x64-portable
          path: release
      - name: Publish portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" release/YouTube-Music-Spear.exe release/YouTube-Music-Spear.exe.sha256 --title "Spear $env:RELEASE_TAG" --generate-notes

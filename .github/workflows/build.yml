name: Build Spear portable
on:
  push:
    branches: [master, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  normalize-generated-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/classic-desktop' && startsWith(github.event.head_commit.message, 'Spear preview:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.normalize.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Use a service identity for the generated preview commit
        id: normalize
        shell: bash
        env:
          GIT_AUTHOR_NAME: Spear contributors
          GIT_AUTHOR_EMAIL: noreply@users.noreply.github.com
          GIT_COMMITTER_NAME: Spear contributors
          GIT_COMMITTER_EMAIL: noreply@users.noreply.github.com
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5feba1b9b3643e695697bb3ac0691c18cacbde70
          safe=$(git commit-tree "HEAD^{tree}" -p "HEAD^" -m "Grow branching trails and restore spawning across tracks")
          git push origin "$safe:refs/heads/feat/classic-desktop" --force-with-lease="refs/heads/feat/classic-desktop:$GITHUB_SHA"
          echo "sha=$safe" >> "$GITHUB_OUTPUT"
  windows:
    needs: normalize-generated-history
    if: always() && (needs.normalize-generated-history.result == 'success' || needs.normalize-generated-history.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.normalize-generated-history.outputs.sha || github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native portable updater
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/updater | Out-Null
          $source = Join-Path $PWD 'scripts\updater\PortableUpdater.cs'
          $output = Join-Path $PWD 'build\updater\Spear-Update.exe'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /reference:System.Web.Extensions.dll /reference:System.Windows.Forms.dll "/out:$output" "$source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm typecheck
      - run: pnpm build
      - name: Smoke test local preferences and portable data
        run: pnpm exec playwright test tests/classic-smoke.test.js --workers=1 --timeout=60000
      - name: Preferences preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Spear-preferences-preview
          path: |
            test-results/spear-preferences.png
            test-results/spear-themes.png
            test-results/spear-like-buttons.png
            test-results/spear-tray.png
            test-results/spear-update.png
            test-results/spear-pulsefield.png
            test-results/spear-equalizer.png
            test-results/spear-visualizer-layout.png
            test-results/spear-compact-layout.png
            test-results/spear-mini-cover.png
          retention-days: 7
      - run: pnpm exec electron-builder --win portable:x64 -p never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build next-version portable fixture
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $parts = ((Get-Content package.json | ConvertFrom-Json).version).Split('.')
          $next = "$($parts[0]).$($parts[1]).$([int]$parts[2]+1)"
          pnpm exec electron-builder --win portable:x64 -p never --config.directories.output=pack-next --config.extraMetadata.version=$next
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real portable replacement and restart
        run: pnpm exec playwright test tests/portable-update.test.js --workers=1 --timeout=240000 --output=updater-test-results
      - name: Checksum
        shell: pwsh
        run: |
          $file = 'pack/YouTube-Music-Spear.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  YouTube-Music-Spear.exe" | Set-Content "$file.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Spear-Windows-x64-portable
          path: |
            pack/YouTube-Music-Spear.exe
            pack/YouTube-Music-Spear.exe.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    if: always() && needs.windows.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/download-artifact@v4
        with:
          name: Spear-Windows-x64-portable
          path: release
      - name: Publish portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view "$tag" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists."; exit 0 }
          gh release create "$tag" release/YouTube-Music-Spear.exe release/YouTube-Music-Spear.exe.sha256 --target "$env:RELEASE_SHA" --title "Spear $tag" --notes "Windows x64 portable. Download YouTube-Music-Spear.exe and place it in a writable folder. Settings are stored in the adjacent data folder. Based on Pear Desktop. Live YouTube playback, downloads and two-version portable updates still require user validation."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

appId: com.magisterion.spear
productName: YouTube Music Spear
files:
  - '!*'
  - dist
  - assets
  - license
  - THIRD_PARTY_VISUALIZERS.txt
  - '!node_modules'
  - 'node_modules/custom-electron-prompt/**'
  - 'node_modules/@ghostery/adblocker-electron-preload/**'
  - 'node_modules/@ffmpeg.wasm/core-mt/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
asarUnpack:
  - assets
win:
  icon: assets/generated/icons/win/icon.ico
  target:
    - target: portable
      arch: [x64]
  artifactName: YouTube-Music-Spear.exe
portable:
  requestExecutionLevel: user
directories:
  output: ./pack/
publish:
  provider: github
  owner: Magisterion
  repo: spear-desktop

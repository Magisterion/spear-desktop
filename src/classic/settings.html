<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>YouTube Music Spear · Settings</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--shell-surface, #17191d);
        color: var(--shell-text, #e4e7ed);
        font:
          13px 'Segoe UI',
          sans-serif;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid #343942;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 7px;
      }
      p {
        color: var(--shell-muted, #a9b1bf);
        margin: 3px 0 6px;
        line-height: 1.5;
      }
      input[type='search'] {
        margin-top: 0;
        width: 100%;
        background: #101216;
        color: white;
        border: 1px solid #484e59;
        border-radius: 6px;
        padding: 10px;
      }
      main {
        display: flex;
        height: calc(100vh - 64px);
      }
      nav {
        width: 190px;
        flex-shrink: 0;
        padding: 15px;
        border-right: 1px solid #343942;
        overflow: auto;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: var(--shell-bottom, #2b3039);
        border: 1px solid #4b5360;
        border-radius: 5px;
        padding: 8px 12px;
        cursor: pointer;
      }
      nav button {
        display: block;
        text-align: left;
        width: 100%;
        margin-bottom: 6px;
        background: none;
        border-color: transparent;
      }
      nav button[aria-current='true'] {
        background: #323b48;
        color: #cee2ff;
        border-color: #596c85;
      }
      section {
        padding: 12px;
        overflow: auto;
        flex: 1;
      }
      article {
        background: var(--shell-top, #20232a);
        border: 1px solid #383e49;
        border-radius: 7px;
        padding: 10px 12px;
        margin-bottom: 6px;
      }
      h2 {
        font-size: 13px;
        margin: 0;
      }
      section {
        min-width: 0;
      }
      .row select {
        width: 220px;
        max-width: 55%;
        flex-shrink: 0;
        text-overflow: ellipsis;
      }
      .theme-previews {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 12px 0 18px;
      }
      .theme-previews button {
        min-height: 48px;
        text-align: left;
      }
      .theme-previews button[aria-pressed='true'] {
        outline: 2px solid currentColor;
        outline-offset: 1px;
      }
      .row {
        min-height: 32px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 0 0 4px;
      }
      input[type='checkbox'],
      input[type='radio'] {
        width: 18px;
        height: 18px;
        accent-color: #9ab9e6;
      }
      details {
        border-top: 1px solid #343942;
        margin-top: 10px;
        padding-top: 10px;
      }
      summary {
        cursor: pointer;
        padding: 5px 0;
        color: #c4d3e8;
      }
      .children {
        padding: 4px 12px;
      }
      small {
        color: #c4ae7c;
      }
      #notice {
        padding: 9px;
        background: #3e3422;
        border-radius: 5px;
        display: none;
      }
      #error {
        color: #ffb4a6;
        white-space: pre-wrap;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid #a9c8f1;
        outline-offset: 2px;
      }
      body[data-pixel='true'] {
        font-family: Consolas, monospace;
      }
      body[data-pixel='true'] :is(button, select, article, input) {
        border-radius: 0;
        box-shadow:
          inset 2px 2px #ffffff25,
          inset -2px -2px #00000035;
      }
      .empty {
        padding: 20px;
        color: var(--shell-muted, #a9b1bf);
      }
      .eq-bands {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 8px;
        padding: 16px 8px;
        margin: 12px 0;
        border: 1px solid var(--shell-accent, #68758b);
        border-radius: 6px;
      }
      .eq-band {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        min-width: 0;
      }
      .eq-band input {
        writing-mode: vertical-lr;
        direction: rtl;
        width: 26px;
        height: 140px;
        padding: 0;
        accent-color: var(--shell-accent, #9eafd0);
      }
      .eq-band output {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <input
        id="search"
        type="search"
        placeholder="Search settings and plugins…"
        aria-label="Search settings and plugins"
      />
    </header>
    <main>
      <nav id="nav" aria-label="Settings categories"></nav>
      <section>
        <div id="notice">
          Changes are saved. Some require a restart.
          <button id="restart">Restart now</button>
        </div>
        <p id="error" role="alert"></p>
        <div id="content"></div>
      </section>
    </main>
    <script>
      let data,
        tab = decodeURIComponent(location.hash.slice(1)) || 'General';
      const categories = [
        'General',
        'Appearance',
        'Themes',
        'Visualizers',
        'Equalizer',
        'Audio',
        'Playback & tools',
        'Lyrics',
        'Downloads',
        'Integrations',
        'Privacy & network',
        'Compatibility & maintenance',
        'About',
      ];
      const $ = (id) => document.getElementById(id);
      const el = (tag, text) => {
        const n = document.createElement(tag);
        if (text) n.textContent = text;
        return n;
      };
      async function request(action, value) {
        try {
          $('error').textContent = '';
          const result = await window.classic.request(action, value);
          if (result && result.plugins) {
            data = result;
            draw();
          }
          return result;
        } catch (e) {
          $('error').textContent = String(e);
        }
      }
      function control(c, parent) {
        if (c.children?.length && c.children.every((x) => x.type === 'radio')) {
          const row = el('label', c.label);
          row.className = 'row';
          const select = el('select');
          select.setAttribute('aria-label', c.label);
          c.children.forEach((x) => {
            const option = el('option', x.label);
            option.value = x.id;
            option.selected = !!x.checked;
            option.disabled = !x.enabled;
            select.append(option);
          });
          select.disabled = !c.enabled;
          select.onchange = () => request('control', select.value);
          row.append(select);
          parent.append(row);
          return;
        }
        if (c.children) {
          const d = el('details');
          d.dataset.control = c.id;
          d.append(el('summary', c.label));
          const box = el('div');
          box.className = 'children';
          c.children.forEach((x) => control(x, box));
          d.append(box);
          parent.append(d);
          return;
        }
        const row = el('label');
        row.className = 'row';
        row.append(el('span', c.label));
        if (c.type === 'checkbox' || c.type === 'radio') {
          const input = el('input');
          input.type = c.type;
          input.checked = !!c.checked;
          input.disabled = !c.enabled;
          input.onchange = () => request('control', c.id);
          row.append(input);
        } else {
          const b = el('button', 'Open');
          b.disabled = !c.enabled;
          b.onclick = () => request('control', c.id);
          row.append(b);
        }
        parent.append(row);
      }
      function draw() {
        const section = document.querySelector('section');
        const scroll = section.scrollTop;
        const opened = new Set(
          [...document.querySelectorAll('details[open]')].map(
            (d) => d.dataset.control,
          ),
        );
        const palette = data.skins.find((s) => s.id === data.skin);
        if (palette) {
          document.body.dataset.pixel = String(!!palette.pixel);
          for (const [key, value] of Object.entries({
            surface: palette.surface,
            top: palette.top,
            bottom: palette.bottom,
            text: palette.text || '#e4e7ed',
            muted: palette.muted || '#a9b1bf',
          }))
            document.body.style.setProperty('--shell-' + key, value);
          document.body.style.background = palette.surface;
          document.querySelector('header').style.background =
            `linear-gradient(${palette.top}, ${palette.bottom})`;
        }
        const query = $('search').value.toLowerCase();
        $('notice').style.display = data.restart.length ? 'block' : 'none';
        $('nav').replaceChildren();
        categories.forEach((name) => {
          const b = el('button', name);
          b.setAttribute('aria-current', String(tab === name));
          b.onclick = () => {
            tab = name;
            draw();
          };
          $('nav').append(b);
        });
        const content = $('content');
        content.replaceChildren();
        if (tab === 'General' || query) {
          const a = el('article');
          a.append(el('h2', 'Application'));
          const language = el('select');
          language.setAttribute('aria-label', 'Language');
          data.languages.forEach((l) => {
            const o = el('option', l.name);
            o.value = l.id;
            language.append(o);
          });
          language.value = data.language;
          language.onchange = () => request('language', language.value);
          const row = el('label', 'Language');
          row.className = 'row';
          row.append(language);
          a.append(row);
          const matches = (c) =>
            !query || JSON.stringify(c).toLowerCase().includes(query);
          const option = (id, parent) => {
            const c = data.general.find((c) => c.menuId === id);
            if (c) {
              if (matches(c)) control(c, parent);
            }
          };
          const group = (title) => {
            const article = el('article');
            article.append(el('h2', title));
            content.append(article);
            return article;
          };
          const toggle = (parent, key, text) => {
            if (query && !text.toLowerCase().includes(query)) return;
            const row = el('label', text);
            row.className = 'row';
            const box = el('input');
            box.type = 'checkbox';
            box.checked = data[key];
            box.onchange = () => request(key, box.checked);
            row.append(box);
            parent.append(row);
          };
          option('classic-start-page', a);
          option('classic-single-instance', a);
          content.append(a);
          const startup = group('Startup');
          option('classic-autostart', startup);
          toggle(
            startup,
            'minimizeOnAutoStart',
            'Start minimized to tray when Windows starts',
          );
          option('classic-resume', startup);
          const windows = group('Windows & tray');
          option('classic-pin', windows);
          toggle(
            windows,
            'trayPinned',
            'Keep tray widget open above other windows',
          );
          toggle(windows, 'tray', 'Show tray icon');
          toggle(
            windows,
            'trayClickOpensWindow',
            'Single click opens the window; double click plays/pauses',
          );
          toggle(
            windows,
            'animatedSpeakers',
            'Animated speakers in tray widget',
          );
          const updates = group('Updates');
          toggle(updates, 'autoUpdates', 'Check for updates at startup');
          const updatesRow = el('div');
          updatesRow.className = 'row';
          const update = el('button', 'Check for updates');
          update.onclick = () => request('update');
          updatesRow.append(update, el('span', `Version ${data.version}`));
          updates.append(updatesRow);
        }
        if (tab === 'Compatibility & maintenance' || query) {
          const a = el('article');
          a.append(el('h2', 'Compatibility & maintenance'));
          data.general
            .filter((c) => c.menuId === 'classic-advanced')
            .flatMap((c) => c.children || [])
            .filter(
              (c) => !query || JSON.stringify(c).toLowerCase().includes(query),
            )
            .forEach((c) => control(c, a));
          if (a.children.length > 1) content.append(a);
        }
        if (tab === 'Themes' && !query) {
          const a = el('article');
          a.append(el('h2', 'Theme'));
          a.append(
            el(
              'p',
              'One theme for the player, title bar, settings and tray widget. Album colors can blend with it.',
            ),
          );
          const previews = el('div');
          previews.className = 'theme-previews';
          data.skins.forEach((palette) => {
            const button = el('button', palette.name);
            button.style.background = `linear-gradient(${palette.top}, ${palette.bottom})`;
            button.style.borderColor = palette.accent;
            button.style.color = palette.accent;
            button.setAttribute(
              'aria-pressed',
              String(data.skin === palette.id),
            );
            button.onclick = () => request('theme', palette.id);
            previews.append(button);
          });
          a.append(previews);
          data.appearance
            .flatMap((c) => c.children || [])
            .filter((c) => c.menuId === 'classic-custom-themes')
            .forEach((c) => {
              a.append(el('h2', 'Custom CSS themes'));
              c.children
                .filter(
                  (x) =>
                    x.enabled &&
                    (x.type !== 'normal' || x.label !== 'No theme'),
                )
                .forEach((x) => control(x, a));
            });
          content.append(a);
        }
        if (tab === 'Privacy & network' && !query) {
          const a = el('article');
          a.append(el('h2', 'Proxy'));
          const label = el('label', 'Proxy server ');
          const input = el('input');
          input.type = 'text';
          input.value = data.proxy;
          input.placeholder = 'http://127.0.0.1:8080';
          input.style.width = '100%';
          input.autocomplete = 'off';
          label.append(input);
          a.append(
            label,
            el(
              'p',
              'Leave empty to use the system connection. Changes take effect after restart.',
            ),
          );
          const save = el('button', 'Apply');
          save.onclick = () => request('proxy', input.value);
          a.append(save);
          content.append(a);
        }
        if (tab === 'Appearance' || query) {
          const a = el('article');
          a.append(el('h2', 'Appearance options'));
          data.appearance
            .flatMap((c) => c.children || [c])
            .filter(
              (c) =>
                !['classic-custom-themes', 'classic-like-buttons'].includes(
                  c.menuId,
                ),
            )
            .filter(
              (c) => !query || JSON.stringify(c).toLowerCase().includes(query),
            )
            .forEach((c) => control(c, a));
          content.append(a);
        }
        if (tab === 'Appearance' || query) {
          const a = el('article');
          a.append(el('h2', 'Like buttons'));
          data.appearance
            .flatMap((c) => c.children || [c])
            .filter((c) => c.menuId === 'classic-like-buttons')
            .flatMap((c) => c.children || [])
            .filter(
              (c) => !query || JSON.stringify(c).toLowerCase().includes(query),
            )
            .forEach((c) => control(c, a));
          if (a.children.length > 1) content.append(a);
        }
        if (tab === 'About' && !query) {
          const a = el('article');
          a.append(
            el('h2', 'YouTube Music Spear'),
            el('p', 'Version ' + data.version),
            el(
              'p',
              'An AI-assisted adaptation of Pear Desktop for people who grew up with classic music players.',
            ),
            el(
              'p',
              'Based on Pear Desktop. MIT license. Independent project, not affiliated with Google or YouTube.',
            ),
          );
          for (const [label, action] of [
            ['Spear on GitHub', 'project'],
            ['Original Pear Desktop', 'upstream'],
          ]) {
            const b = el('button', label);
            b.onclick = () => request(action);
            a.append(b);
          }
          content.append(a);
        }
        data.plugins
          .filter(
            (p) =>
              (query || p.category === tab) &&
              (!query ||
                (p.name + ' ' + p.description).toLowerCase().includes(query)),
          )
          .forEach((p) => {
            const a = el('article'),
              row = el('label');
            row.className = 'row';
            row.append(el('h2', p.name));
            const enabled = el('input');
            enabled.type = 'checkbox';
            enabled.checked = p.enabled;
            enabled.setAttribute('aria-label', 'Enable ' + p.name);
            enabled.onchange = () =>
              request('plugin', { id: p.id, enabled: enabled.checked });
            row.append(enabled);
            a.append(row, el('p', p.description));
            if (p.restart)
              a.append(
                el('small', 'Enabling or disabling requires a restart.'),
              );
            if (p.enabled) p.controls.forEach((c) => control(c, a));
            if (p.id === 'equalizer' && p.enabled) {
              const gains = [...data.equalizer.gains];
              const bands = el('div');
              bands.className = 'eq-bands';
              let pending;
              const save = async () => {
                clearTimeout(pending);
                try {
                  await window.classic.request('equalizer', [...gains]);
                } catch (error) {
                  $('error').textContent = String(error);
                }
              };
              [31, 62, 125, 250, 500, 1000, 2000, 4000, 8000, 16000].forEach(
                (hz, i) => {
                  const band = el('label');
                  band.className = 'eq-band';
                  const output = el(
                    'output',
                    `${gains[i] > 0 ? '+' : ''}${gains[i]} dB`,
                  );
                  const slider = el('input');
                  slider.type = 'range';
                  slider.min = '-12';
                  slider.max = '12';
                  slider.step = '0.5';
                  slider.value = gains[i];
                  slider.setAttribute('aria-label', `${hz} Hz gain`);
                  slider.oninput = () => {
                    gains[i] = Number(slider.value);
                    output.textContent = `${gains[i] > 0 ? '+' : ''}${gains[i]} dB`;
                    data.equalizer = { preset: 'custom', gains: [...gains] };
                    const custom = [...a.querySelector('select').options].find(
                      (o) => o.textContent === 'Custom',
                    );
                    if (custom) a.querySelector('select').value = custom.value;
                    clearTimeout(pending);
                    pending = setTimeout(save, 60);
                  };
                  slider.onchange = save;
                  band.append(
                    output,
                    slider,
                    el('span', hz >= 1000 ? `${hz / 1000}k` : String(hz)),
                  );
                  bands.append(band);
                },
              );
              const reset = el('button', 'Reset to Flat');
              reset.onclick = () => {
                clearTimeout(pending);
                const select = a.querySelector('select');
                const flat = [...select.options].find(
                  (o) => o.textContent === 'Flat (default)',
                );
                if (flat) request('control', flat.value);
              };
              a.append(
                bands,
                reset,
                el(
                  'p',
                  'Changes apply immediately. Positive boosts automatically reserve headroom to reduce clipping.',
                ),
              );
            }
            content.append(a);
          });
        document.querySelectorAll('details').forEach((d) => {
          d.open = opened.has(d.dataset.control);
        });
        section.scrollTop = scroll;
        if (!content.childElementCount) {
          const empty = el('p', 'No matching settings.');
          empty.className = 'empty';
          content.append(empty);
        }
      }
      window.classic.onTab((name) => {
        if (!categories.includes(name)) return;
        tab = name;
        $('search').value = '';
        if (data) draw();
      });
      $('search').oninput = () => draw();
      $('restart').onclick = () => request('restart');
      window.classic.onRefresh(() => request('snapshot'));
      request('snapshot');
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: linear-gradient(#2e333c, #17191d);
        color: #dce5f1;
        font:
          14px 'Segoe UI',
          sans-serif;
        border: 1px solid #626e80;
        height: 168px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 7px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      p {
        color: #9dabbd;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin: 17px 0;
      }
      button {
        cursor: pointer;
        background: #343c49;
        border: 1px solid #66738a;
        color: #e5f0ff;
        border-radius: 4px;
        padding: 6px 15px;
        font-size: 20px;
      }
      footer {
        display: flex;
        justify-content: space-between;
      }
      footer button {
        font-size: 12px;
        padding: 5px 10px;
      }
      button:focus-visible {
        outline: 2px solid #bfd9ff;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Nothing playing</h1>
    <p id="artist">Spear</p>
    <div class="controls">
      <button
        data-action="previous"
        aria-label="Previous track"
        title="Previous track"
      >
        ⏮</button
      ><button
        id="play"
        data-action="playPause"
        aria-label="Play or pause"
        title="Play or pause"
      >
        ▶</button
      ><button data-action="next" aria-label="Next track" title="Next track">
        ⏭
      </button>
    </div>
    <footer>
      <button data-action="show">Open player</button
      ><button data-action="settings">Settings</button
      ><button data-action="quit">Exit</button>
    </footer>
    <script>
      document
        .querySelectorAll('[data-action]')
        .forEach(
          (b) => (b.onclick = () => window.classic.request(b.dataset.action)),
        );
      async function refresh() {
        const s = await window.classic.request('song');
        document.getElementById('title').textContent = s.title;
        document.getElementById('artist').textContent = s.artist;
        document.getElementById('play').textContent = s.paused ? '▶' : '⏸';
      }
      refresh();
      setInterval(() => {
        if (!document.hidden) refresh();
      }, 500);
      document.addEventListener('visibilitychange', refresh);
    </script>
  </body>
</html>

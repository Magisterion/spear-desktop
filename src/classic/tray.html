<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>YouTube Music Spear</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        padding: 18px 20px;
        color: var(--shell-text, #edf1f7);
        background: linear-gradient(
          145deg,
          var(--shell-top, #2a2f37),
          var(--shell-bottom, #171a20)
        );
        border: 1px solid var(--shell-accent, #48505e);
        font:
          13px 'Segoe UI',
          sans-serif;
        user-select: none;
      }
      button {
        font: inherit;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      button:hover {
        background: #ffffff14;
      }
      button:focus-visible {
        outline: 2px solid #b8d3fb;
        outline-offset: 1px;
      }
      svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
        flex-shrink: 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 32px;
        margin-bottom: 18px;
      }
      .brand {
        font-size: 11px;
        color: var(--shell-muted, #9faaba);
        letter-spacing: 0.2px;
      }
      .tools {
        display: flex;
        gap: 4px;
      }
      .tools button {
        width: 32px;
        height: 30px;
      }
      #quit:hover {
        background: #a63843;
      }
      .track {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .cover {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        position: relative;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #343c49;
        color: #b4c0d1;
        overflow: hidden;
      }
      .cover svg {
        width: 25px;
        height: 25px;
      }
      .cover img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover img[hidden] {
        display: none;
      }
      .text {
        min-width: 0;
        flex: 1;
      }
      h1,
      p {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
      }
      h1 {
        font-size: 14px;
        line-height: 21px;
        font-weight: 600;
      }
      p {
        color: var(--shell-muted, #a6b2c3);
        line-height: 21px;
        font-size: 12px;
      }
      .controls {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 17px;
        margin-top: 16px;
        margin-bottom: 12px;
      }
      .controls button {
        width: 46px;
        height: 46px;
      }
      .controls button svg {
        width: 24px;
        height: 24px;
      }
      .controls #play svg {
        width: 28px;
        height: 28px;
      }
      .controls #play {
        width: 58px;
        height: 58px;
        background: var(--shell-accent, #dbe6f6);
        color: var(--shell-accent-text, #19212d);
        border-radius: 50%;
      }
      button[aria-pressed='true'] {
        outline: 2px solid var(--shell-accent);
      }
      .controls #play:hover {
        background: #fff;
      }
      #pauseIcon {
        display: none;
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 21px;
        font-size: 10px;
        color: var(--shell-muted, #9caabd);
        font-variant-numeric: tabular-nums;
      }
      #progress {
        flex: 1;
        min-width: 0;
        height: 22px;
        cursor: pointer;
        background: transparent;
        accent-color: var(--shell-accent);
        border: 0;
        appearance: none;
      }
      #progress::-webkit-slider-runnable-track {
        height: 4px;
        background: #3b4350;
        border-radius: 3px;
      }
      #progress::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        margin-top: -4px;
        border-radius: 50%;
        background: var(--shell-accent, #aebfda);
        border-radius: 3px;
      }
      body[data-pixel='true'] {
        font-family: Consolas, monospace;
        background-image:
          repeating-linear-gradient(0deg, #00000008 0 1px, transparent 1px 4px),
          linear-gradient(var(--shell-top), var(--shell-bottom));
      }
      body[data-pixel='true'] :is(button, .cover) {
        border-radius: 0;
        box-shadow:
          inset 2px 2px #ffffff25,
          inset -2px -2px #00000035;
      }
      #status {
        position: absolute;
        bottom: 2px;
        left: 14px;
        right: 14px;
        font-size: 10px;
        color: #ffb8b8;
        pointer-events: none;
      }
      .speaker {
        width: 32px;
        height: 60px;
        border: 1px solid var(--shell-muted);
        background: var(--shell-bottom);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        border-radius: 3px;
      }
      .speaker::before {
        content: '';
        width: 8px;
        height: 8px;
        border: 2px solid var(--shell-muted);
        border-radius: 50%;
      }
      .speaker::after {
        content: '';
        width: 21px;
        height: 21px;
        border: 3px solid var(--shell-accent);
        border-radius: 50%;
        background: var(--shell-surface, #20232a);
        transform: scale(calc(0.85 + var(--bass, 0) * 0.25));
        transition: transform 80ms linear;
      }
      body[data-speakers='false'] .speaker {
        display: none;
      }
      .brand {
        max-width: 190px;
      }
      .tools {
        flex-shrink: 0;
      }
      body {
        padding: 16px 24px 22px;
        display: grid;
        grid-template-rows: 32px 72px minmax(64px, 1fr) 28px;
        gap: 12px;
      }
      .top {
        margin: 0;
      }
      .track {
        gap: 14px;
      }
      .controls {
        height: auto;
        min-height: 64px;
        margin: 0;
        gap: 18px;
      }
      .speaker {
        width: 40px;
        height: 64px;
      }
      .speaker:first-child {
        margin-right: auto;
      }
      .speaker:last-child {
        margin-left: auto;
      }
      .speaker::after {
        width: 26px;
        height: 26px;
        transform: scale(calc(0.75 + var(--bass, 0) * 0.48));
        box-shadow: 0 0 calc(var(--bass, 0) * 12px) var(--shell-accent);
        transition:
          transform 45ms linear,
          box-shadow 45ms linear;
      }
      .bottom {
        height: 28px;
        min-width: 0;
      }
      #progress {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="brand">YouTube Music Spear</span>
      <div class="tools">
        <button data-action="show" title="Open player" aria-label="Open player">
          <svg viewBox="0 0 24 24">
            <path
              d="M4 5h16v14H4zM5 8h14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </button>
        <button data-action="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <path
              d="M10 3h4l1 3 3-1 2 3-2 3 2 3-2 3-3-1-1 3h-4l-1-3-3 1-2-3 2-3-2-3 2-3 3 1Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle
              cx="12"
              cy="11"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
        </button>
        <button data-action="game" title="Pulseflight" aria-label="Pulseflight">
          <svg viewBox="0 0 24 24">
            <path
              d="M7 7h10l4 10-3 2-4-4h-4l-4 4-3-2Z M7 10v4m-2-2h4m7-1h.01m2 2h.01"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
          </svg>
        </button>
        <button
          data-action="visualizer"
          title="Fullscreen visualizer"
          aria-label="Fullscreen visualizer"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h2l2-4 2 8 2-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            />
          </svg>
        </button>
        <button
          id="pin"
          data-action="pin"
          title="Keep widget open"
          aria-label="Keep widget open"
          aria-pressed="false"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M8 3h8l-1 7 4 4H5l4-4Z M12 14v7" />
          </svg>
        </button>
        <button
          id="quit"
          data-action="quit"
          title="Exit app"
          aria-label="Exit app"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3v9M6 6a8 8 0 1 0 12 0"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </div>
    <div class="track">
      <div class="cover">
        <svg viewBox="0 0 24 24">
          <path d="M9 3v13a4 4 0 1 0 2 3V7l8-2v9a4 4 0 1 0 2 3V1Z" /></svg
        ><img id="art" alt="" hidden />
      </div>
      <div class="text">
        <h1 id="title">Nothing playing</h1>
        <p id="artist">Start your music</p>
      </div>
    </div>
    <div class="controls">
      <span class="speaker" aria-hidden="true"></span>
      <button
        data-action="previous"
        title="Previous track"
        aria-label="Previous track"
      >
        <svg viewBox="0 0 24 24"><path d="M5 5h2v14H5zM19 5v14L8 12Z" /></svg>
      </button>
      <button id="play" data-action="playPause" title="Play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 4v16l13-8Z" /></svg
        ><svg id="pauseIcon" viewBox="0 0 24 24">
          <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
        </svg>
      </button>
      <button data-action="next" title="Next track" aria-label="Next track">
        <svg viewBox="0 0 24 24">
          <path d="M17 5h2v14h-2zM5 5l11 7-11 7Z" />
        </svg>
      </button>
      <span class="speaker" aria-hidden="true"></span>
    </div>
    <div class="bottom">
      <span id="elapsed">0:00</span
      ><input
        id="progress"
        type="range"
        min="0"
        max="1"
        value="0"
        step="1"
        aria-label="Seek track"
      /><span id="duration">0:00</span>
    </div>
    <span id="status" role="status"></span>
    <script>
      const $ = (id) => document.getElementById(id);
      document.querySelectorAll('[data-action]').forEach(
        (b) =>
          (b.onclick = async () => {
            try {
              await window.classic.request(b.dataset.action);
              $('status').textContent = '';
            } catch {
              $('status').textContent =
                'Player unavailable. Try opening the main window.';
            }
          }),
      );
      const time = (s) => {
        const v = Math.max(0, Math.floor(Number(s) || 0));
        return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
      };
      let seeking = false;
      $('progress').oninput = () => {
        seeking = true;
        $('elapsed').textContent = time($('progress').value);
      };
      $('progress').onchange = async () => {
        try {
          await window.classic.request('seek', Number($('progress').value));
        } finally {
          seeking = false;
        }
      };
      let refreshing = false;
      let audioAt = 0;
      function audio(level) {
        audioAt = Date.now();
        document.body.style.setProperty(
          '--bass',
          String(Math.max(0, Math.min(1, Number(level) || 0))),
        );
      }
      window.classic.onAudio?.(audio);
      setInterval(() => {
        if (Date.now() - audioAt > 500) audio(0);
      }, 250);
      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          const s = await window.classic.request('song');
          $('pin').setAttribute('aria-pressed', String(!!s.trayPinned));
          document.body.dataset.speakers = String(s.animatedSpeakers !== false);
          if (s.paused || Date.now() - audioAt > 250)
            audio(s.paused ? 0 : s.bass);
          if (s.palette) {
            document.body.dataset.pixel = String(!!s.palette.pixel);
            document.body.style.setProperty(
              '--shell-text',
              s.palette.text || '#edf1f7',
            );
            document.body.style.setProperty(
              '--shell-muted',
              s.palette.muted || '#a9b1bf',
            );
            document.body.style.setProperty(
              '--shell-accent-text',
              s.palette.accentText || '#19212d',
            );
          }
          if (s.palette)
            for (const key of ['top', 'bottom', 'accent'])
              document.body.style.setProperty('--shell-' + key, s.palette[key]);
          $('title').textContent = s.title;
          $('title').title = s.title;
          $('artist').textContent = s.artist;
          $('artist').title = s.artist;
          $('playIcon').style.display = s.paused ? 'block' : 'none';
          $('pauseIcon').style.display = s.paused ? 'none' : 'block';
          $('play').setAttribute('aria-label', s.paused ? 'Play' : 'Pause');
          $('play').title = s.paused ? 'Play' : 'Pause';
          const art = $('art');
          if (s.artwork && s.artwork.startsWith('data:image/png;')) {
            if (art.getAttribute('src') !== s.artwork) art.src = s.artwork;
            art.hidden = false;
          } else {
            art.hidden = true;
            art.removeAttribute('src');
          }
          if (!seeking) $('elapsed').textContent = time(s.elapsed);
          $('duration').textContent = time(s.duration);
          $('progress').max = Math.max(1, s.duration || 0);
          $('progress').disabled = !(s.duration > 0);
          if (!seeking)
            $('progress').value = Math.min(s.elapsed || 0, s.duration || 0);
        } catch {
        } finally {
          refreshing = false;
        }
      }
      $('art').onerror = () => {
        $('art').hidden = true;
      };
      window.classic.onRefresh?.(() => {
        seeking = false;
        refresh();
      });
      window.addEventListener('focus', refresh);
      refresh();
      setInterval(() => {
        if (!document.hidden) refresh();
      }, 500);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
      });
    </script>
  </body>
</html>

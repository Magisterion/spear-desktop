<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>YouTube Music Spear</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        padding: 16px 18px;
        color: var(--shell-text, #edf1f7);
        background: linear-gradient(
          145deg,
          var(--shell-top, #2a2f37),
          var(--shell-bottom, #171a20)
        );
        border: 1px solid var(--shell-accent, #48505e);
        font:
          13px 'Segoe UI',
          sans-serif;
        user-select: none;
      }
      button {
        font: inherit;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      button:hover {
        background: #ffffff14;
      }
      button:focus-visible {
        outline: 2px solid #b8d3fb;
        outline-offset: 1px;
      }
      svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
        flex-shrink: 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 24px;
        margin-bottom: 14px;
      }
      .brand {
        font-size: 11px;
        color: var(--shell-muted, #9faaba);
        letter-spacing: 0.2px;
      }
      .tools {
        display: flex;
        gap: 4px;
      }
      .tools button {
        width: 32px;
        height: 30px;
      }
      #quit:hover {
        background: #a63843;
      }
      .track {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .cover {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        position: relative;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #343c49;
        color: #b4c0d1;
        overflow: hidden;
      }
      .cover svg {
        width: 25px;
        height: 25px;
      }
      .cover img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover img[hidden] {
        display: none;
      }
      .text {
        min-width: 0;
        flex: 1;
      }
      h1,
      p {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
      }
      h1 {
        font-size: 14px;
        line-height: 21px;
        font-weight: 600;
      }
      p {
        color: var(--shell-muted, #a6b2c3);
        line-height: 21px;
        font-size: 12px;
      }
      .controls {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 17px;
        margin-top: 10px;
      }
      .controls button {
        width: 34px;
        height: 32px;
      }
      .controls #play {
        width: 44px;
        height: 44px;
        background: var(--shell-accent, #dbe6f6);
        color: var(--shell-accent-text, #19212d);
        border-radius: 50%;
      }
      .controls #play:hover {
        background: #fff;
      }
      #pauseIcon {
        display: none;
      }
      .bottom {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 21px;
        font-size: 10px;
        color: var(--shell-muted, #9caabd);
        font-variant-numeric: tabular-nums;
      }
      progress {
        flex: 1;
        min-width: 0;
        height: 3px;
        border: 0;
        appearance: none;
      }
      progress::-webkit-progress-bar {
        background: #3b4350;
        border-radius: 3px;
      }
      progress::-webkit-progress-value {
        background: var(--shell-accent, #aebfda);
        border-radius: 3px;
      }
      body[data-pixel='true'] {
        font-family: Consolas, monospace;
        background-image:
          repeating-linear-gradient(0deg, #00000008 0 1px, transparent 1px 4px),
          linear-gradient(var(--shell-top), var(--shell-bottom));
      }
      body[data-pixel='true'] :is(button, .cover) {
        border-radius: 0;
        box-shadow:
          inset 2px 2px #ffffff25,
          inset -2px -2px #00000035;
      }
      #status {
        position: absolute;
        bottom: 2px;
        left: 14px;
        right: 14px;
        font-size: 10px;
        color: #ffb8b8;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="brand">YouTube Music Spear</span>
      <div class="tools">
        <button data-action="show" title="Open player" aria-label="Open player">
          <svg viewBox="0 0 24 24">
            <path
              d="M4 5h16v14H4zM5 8h14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </button>
        <button data-action="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24">
            <path
              d="M10 3h4l1 3 3-1 2 3-2 3 2 3-2 3-3-1-1 3h-4l-1-3-3 1-2-3 2-3-2-3 2-3 3 1Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <circle
              cx="12"
              cy="11"
              r="3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
        </button>
        <button
          id="quit"
          data-action="quit"
          title="Exit app"
          aria-label="Exit app"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3v9M6 6a8 8 0 1 0 12 0"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
    </div>
    <div class="track">
      <div class="cover">
        <svg viewBox="0 0 24 24">
          <path d="M9 3v13a4 4 0 1 0 2 3V7l8-2v9a4 4 0 1 0 2 3V1Z" /></svg
        ><img id="art" alt="" hidden />
      </div>
      <div class="text">
        <h1 id="title">Nothing playing</h1>
        <p id="artist">Start your music</p>
      </div>
    </div>
    <div class="controls">
      <button
        data-action="previous"
        title="Previous track"
        aria-label="Previous track"
      >
        <svg viewBox="0 0 24 24"><path d="M5 5h2v14H5zM19 5v14L8 12Z" /></svg>
      </button>
      <button id="play" data-action="playPause" title="Play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 4v16l13-8Z" /></svg
        ><svg id="pauseIcon" viewBox="0 0 24 24">
          <path d="M6 4h4v16H6zM14 4h4v16h-4z" />
        </svg>
      </button>
      <button data-action="next" title="Next track" aria-label="Next track">
        <svg viewBox="0 0 24 24">
          <path d="M17 5h2v14h-2zM5 5l11 7-11 7Z" />
        </svg>
      </button>
    </div>
    <div class="bottom">
      <span id="elapsed">0:00</span
      ><progress
        id="progress"
        value="0"
        max="1"
        aria-label="Track progress"
      ></progress
      ><span id="duration">0:00</span>
    </div>
    <span id="status" role="status"></span>
    <script>
      const $ = (id) => document.getElementById(id);
      document.querySelectorAll('[data-action]').forEach(
        (b) =>
          (b.onclick = async () => {
            try {
              await window.classic.request(b.dataset.action);
              $('status').textContent = '';
            } catch {
              $('status').textContent =
                'Player unavailable. Try opening the main window.';
            }
          }),
      );
      const time = (s) => {
        const v = Math.max(0, Math.floor(Number(s) || 0));
        return Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
      };
      let refreshing = false;
      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          const s = await window.classic.request('song');
          if (s.palette) {
            document.body.dataset.pixel = String(!!s.palette.pixel);
            document.body.style.setProperty(
              '--shell-text',
              s.palette.text || '#edf1f7',
            );
            document.body.style.setProperty(
              '--shell-muted',
              s.palette.muted || '#a9b1bf',
            );
            document.body.style.setProperty(
              '--shell-accent-text',
              s.palette.accentText || '#19212d',
            );
          }
          if (s.palette)
            for (const key of ['top', 'bottom', 'accent'])
              document.body.style.setProperty('--shell-' + key, s.palette[key]);
          $('title').textContent = s.title;
          $('title').title = s.title;
          $('artist').textContent = s.artist;
          $('artist').title = s.artist;
          $('playIcon').style.display = s.paused ? 'block' : 'none';
          $('pauseIcon').style.display = s.paused ? 'none' : 'block';
          $('play').setAttribute('aria-label', s.paused ? 'Play' : 'Pause');
          $('play').title = s.paused ? 'Play' : 'Pause';
          const art = $('art');
          if (s.artwork && s.artwork.startsWith('data:image/png;')) {
            if (art.getAttribute('src') !== s.artwork) art.src = s.artwork;
            art.hidden = false;
          } else {
            art.hidden = true;
            art.removeAttribute('src');
          }
          $('elapsed').textContent = time(s.elapsed);
          $('duration').textContent = time(s.duration);
          $('progress').max = Math.max(1, s.duration || 0);
          $('progress').value = Math.min(s.elapsed || 0, s.duration || 0);
        } catch {
        } finally {
          refreshing = false;
        }
      }
      $('art').onerror = () => {
        $('art').hidden = true;
      };
      refresh();
      setInterval(() => {
        if (!document.hidden) refresh();
      }, 500);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>YouTube Music Spear · Updates</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 22px;
        background: #17191d;
        color: #e6edf7;
        font:
          13px 'Segoe UI',
          sans-serif;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 9px;
        font-weight: 600;
      }
      p {
        color: #aab7ca;
        margin: 0 0 14px;
        line-height: 1.5;
      }
      #version {
        font-size: 12px;
        color: #8fa2bd;
        margin-bottom: 18px;
      }
      progress {
        width: 100%;
        height: 7px;
        appearance: none;
        border: 0;
      }
      progress::-webkit-progress-bar {
        background: #343d4b;
        border-radius: 4px;
      }
      progress::-webkit-progress-value {
        background: #a9c6ed;
        border-radius: 4px;
      }
      #stats {
        height: 19px;
        margin-top: 7px;
        color: #b4c3d9;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      #message {
        min-height: 48px;
        max-height: 70px;
        overflow: auto;
        margin-top: 13px;
      }
      footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      button {
        font: inherit;
        border: 1px solid #4d5a6e;
        color: #e5edf8;
        background: #28313e;
        padding: 8px 13px;
        border-radius: 5px;
        cursor: pointer;
      }
      button.primary {
        background: #c4d8f4;
        color: #152137;
        border-color: #c4d8f4;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:focus-visible {
        outline: 2px solid #bdd8ff;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      #releases {
        margin-right: auto;
        background: none;
        border: 0;
        padding-left: 0;
        color: #a9c6ed;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Checking for updates…</h1>
    <div id="version"></div>
    <progress
      id="progress"
      max="100"
      aria-label="Update download progress"
    ></progress>
    <div id="stats"></div>
    <p id="message" role="status" aria-live="polite">
      You can keep using the player.
    </p>
    <footer>
      <button id="releases">Release page</button
      ><button id="cancel" hidden>Cancel</button
      ><button id="later">Later</button
      ><button id="primary" class="primary" hidden>Download update</button>
    </footer>
    <script>
      const $ = (id) => document.getElementById(id);
      let state;
      let polling = false;
      const mb = (n) => (n / 1048576).toFixed(1) + ' MB';
      async function request(action) {
        try {
          const value = await window.updates.request(action);
          if (value) render(value);
        } catch {
          $('message').textContent =
            'The update service is unavailable. You can keep using the player.';
        }
      }
      function render(s) {
        state = s;
        const names = {
          checking: 'Checking for updates…',
          available: 'An update is available',
          downloading: 'Downloading update',
          verifying: 'Verifying download',
          ready: 'Portable update ready',
          installing: 'Restarting Spear…',
          current: 'You are up to date',
          cancelled: 'Download cancelled',
          error: 'Update could not complete',
          unsupported: 'Windows portable updates',
        };
        $('heading').textContent = names[s.phase];
        $('version').textContent = s.version
          ? 'Version ' + s.currentVersion + ' → ' + s.version
          : 'Current version ' + s.currentVersion;
        const active = [
          'checking',
          'downloading',
          'verifying',
          'installing',
        ].includes(s.phase);
        const p = $('progress');
        p.hidden = !active;
        if (s.phase === 'downloading' && s.total) {
          p.value = (100 * s.received) / s.total;
          $('stats').textContent =
            Math.floor(p.value) +
            '% · ' +
            mb(s.received) +
            ' / ' +
            mb(s.total) +
            (s.speed ? ' · ' + mb(s.speed) + '/s' : '');
        } else {
          p.removeAttribute('value');
          $('stats').textContent =
            s.phase === 'available'
              ? mb(s.total) + ' · Windows x64 portable'
              : '';
        }
        $('message').textContent =
          s.message ||
          (s.phase === 'available'
            ? 'Download now and restart when you are ready. Your settings and sign-in will be preserved.'
            : s.phase === 'downloading'
              ? 'You can minimize this window and keep listening.'
              : 'You can keep using the player.');
        $('cancel').hidden = !['downloading', 'verifying'].includes(s.phase);
        $('later').hidden = ['downloading', 'verifying', 'installing'].includes(
          s.phase,
        );
        $('later').textContent = s.phase === 'ready' ? 'Later' : 'Close';
        const primary = $('primary');
        primary.hidden = active || ['current', 'unsupported'].includes(s.phase);
        primary.textContent =
          s.phase === 'ready'
            ? 'Restart and update'
            : s.phase === 'available' || s.phase === 'cancelled'
              ? 'Download update'
              : 'Try again';
      }
      $('cancel').onclick = () => request('cancel');
      $('later').onclick = () => request('close');
      $('releases').onclick = () => request('releases');
      $('primary').onclick = () =>
        request(
          state.phase === 'ready'
            ? 'install'
            : state.canDownload &&
                ['available', 'cancelled', 'error'].includes(state.phase)
              ? 'download'
              : 'check',
        );
      async function refresh() {
        if (polling) return;
        polling = true;
        await request('state');
        polling = false;
      }
      refresh();
      setInterval(() => {
        if (!document.hidden) refresh();
      }, 200);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
      });
    </script>
  </body>
</html>
